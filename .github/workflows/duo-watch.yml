name: duo-watch
on:
  schedule:
    # Tracker active hours (6:30 AM-9:30 PM EDT = 10:30-01:30 UTC): every 5 min
    - cron: "30-59/5 10 * * *"
    - cron: "*/5 11-23,0 * * *"
    - cron: "0-30/5 1 * * *"
    # Tracker off hours: every 20 min
    - cron: "*/20 2-9 * * *"
    - cron: "0,20 10 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Check for Duo availability
        run: python3 duo_watch.py
        env:
          ZIP: "97301"
          RADIUS_MILES: "75"
          STORAGE_GB: "256"
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
